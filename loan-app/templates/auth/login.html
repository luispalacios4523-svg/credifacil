{% extends "base.html" %}
{% block title %}Iniciar sesión — CréditoFácil{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-1">Iniciar sesión</h2>
    <p class="text-gray-500 text-sm mb-6">¿No tienes cuenta? <a href="{{ url_for('register') }}" class="text-blue-600 hover:underline">Regístrate gratis</a></p>

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
        <input type="email" name="email" required autocomplete="email"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="tu@correo.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" name="password" required autocomplete="current-password"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="••••••••" />
      </div>
      <button type="submit"
        class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition text-sm">
        Entrar
      </button>
    </form>

    <div class="mt-6 p-4 bg-gray-50 rounded-lg text-xs text-gray-500 border border-gray-200">
      <strong>Admin por defecto:</strong> admin@loans.com / admin123
    </div>
  </div>
</div>
{% endblock %}
